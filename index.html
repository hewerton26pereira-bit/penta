<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Escalas">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Escalas — Guitarra</title>
<style>
:root{
  --bg:#0d1117;--panel:#161b22;--panel2:#0d1117;--line:#21262d;--line2:#30363d;
  --text:#e6edf3;--muted:#7d8590;--dim:#8b949e;
  --accent:#7c3aed;--rm:#ff6b6b;--rM:#ffd43b;--cyan:#22d3ee;--green:#34d399;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,-apple-system,sans-serif;min-height:100vh;padding-bottom:env(safe-area-inset-bottom,0px)}
button{font-family:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}

header{padding:calc(14px + env(safe-area-inset-top,0px)) 20px 12px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
.logo{width:36px;height:36px;border-radius:9px;flex-shrink:0}
header h1{font-size:18px;font-weight:600}
header p{color:var(--muted);font-size:12px;margin-top:2px}

.controls{padding:12px 20px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:9px}
.key-row{display:flex;flex-wrap:wrap;gap:5px}
.key-btn{min-width:40px;padding:5px 10px;border-radius:6px;border:1px solid var(--line2);background:var(--panel);color:var(--dim);font-size:13px;cursor:pointer;font-weight:500;transition:background .12s,color .12s,border-color .12s}
.key-btn:hover{border-color:var(--accent);color:var(--text)}
.key-btn.active{background:var(--accent);border-color:var(--accent);color:#fff}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.toggle-group{display:flex;border:1px solid var(--line2);border-radius:7px;overflow:hidden}
.tg-btn{padding:6px 13px;background:var(--panel);border:none;color:var(--dim);font-size:13px;cursor:pointer;white-space:nowrap}
.tg-btn+.tg-btn{border-left:1px solid var(--line2)}
.tg-btn.active{background:#21262d;color:var(--text);font-weight:600}
.tg-btn.active[data-type=penta]{color:#a78bfa}
.tg-btn.active[data-type=natural]{color:var(--green)}
.tg-btn.active[data-mode=minor]{color:var(--rm)}
.tg-btn.active[data-mode=major]{color:var(--rM)}
.tg-btn.active[data-labels]{color:var(--cyan)}
.rel-badge{background:var(--panel);border:1px solid var(--line2);border-radius:7px;padding:6px 12px;font-size:12px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.rel-badge span{color:var(--muted)}
.pills{display:flex;gap:5px;flex-wrap:wrap}
.np{display:flex;align-items:baseline;gap:4px;padding:3px 9px;border-radius:20px;border:1px solid var(--line2);background:var(--panel2);font-size:12px;font-weight:600;color:var(--text)}
.np small{font-size:10px;color:var(--muted);font-weight:500}
.np.rm{border-color:var(--rm);color:var(--rm)}
.np.rM{border-color:var(--rM);color:var(--rM)}
.np.bn{border-color:var(--cyan);color:var(--cyan);border-style:dashed}

.tabs{display:flex;border-bottom:1px solid var(--line);padding:0 12px;overflow-x:auto}
.tab-btn{padding:10px 14px;background:none;border:none;border-bottom:2px solid transparent;color:var(--muted);font-size:13px;cursor:pointer;font-weight:500;margin-bottom:-1px;white-space:nowrap}
.tab-btn.active{color:var(--text);border-bottom-color:var(--accent)}
.panel{display:none;padding:14px 20px 18px}
.panel.active{display:block}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,400px),1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 14px;border-bottom:1px solid var(--line)}
.card-title{font-size:14px;font-weight:600}
.card-meta{display:flex;align-items:center;gap:6px;flex-shrink:0}
.badge{font-size:11px;color:var(--dim);background:var(--panel2);border-radius:4px;padding:2px 8px;white-space:nowrap}
.link-btn{font-size:11px;color:#a78bfa;background:none;border:1px solid var(--line2);border-radius:5px;padding:2px 8px;cursor:pointer;white-space:nowrap}
.link-btn:hover{border-color:#a78bfa}
.neck-wrap{padding:8px 10px 6px;overflow-x:auto;display:flex;justify-content:center}
svg.neck{display:block;max-width:100%;height:auto}
svg .note{cursor:pointer}
svg .note:hover circle{stroke:#fff}
svg .note.hit circle{stroke:#fff;stroke-width:3}

.fn-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:10px 14px;border-bottom:1px solid var(--line)}
.fn-title{font-size:14px;font-weight:600}
.chips{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.chips-label{font-size:11px;color:var(--muted);margin-right:2px}
.chip{padding:4px 10px;border-radius:14px;border:1px solid var(--line2);background:var(--panel2);color:var(--dim);font-size:12px;cursor:pointer}
.chip.active{background:var(--accent);border-color:var(--accent);color:#fff}
.fn-wrap{padding:10px 12px 12px;overflow-x:auto}
svg.fullneck{display:block;width:100%;min-width:720px;height:auto}

.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.ctrl{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line2);border-radius:7px;padding:6px 12px;font-size:12px;color:var(--dim)}
.ctrl input[type=range]{accent-color:var(--accent);width:120px}
.ctrl input[type=checkbox]{accent-color:var(--accent)}
.ctrl strong{color:var(--text);min-width:24px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:7px;border:1px solid var(--line2);background:var(--panel);color:var(--text);font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--dim)}
.btn.on,.btn.playing{border-color:var(--cyan);color:var(--cyan)}
.tip{font-size:12px;color:var(--dim);background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:6px;padding:8px 12px;margin-bottom:14px;line-height:1.55}
.lick-desc{font-size:12px;color:var(--dim);padding:8px 14px 0;line-height:1.5}
.tags{display:flex;gap:4px;flex-wrap:wrap;padding:7px 14px 0}
.tag{font-size:11px;font-weight:600;color:#a78bfa;background:rgba(124,58,237,.13);border-radius:4px;padding:2px 7px}
.tag.cy{color:var(--cyan);background:rgba(34,211,238,.1)}
.tab-wrap{padding:8px 14px 0;overflow-x:auto}
svg.tab{display:block}
svg.tab text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
svg.tab .fnum{fill:#e6edf3}
svg.tab .fnum.on{fill:#22d3ee;font-weight:700}

.legend{display:flex;gap:14px;padding:11px 20px;border-top:1px solid var(--line);flex-wrap:wrap;align-items:center}
.li{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--muted)}
.ld{width:12px;height:12px;border-radius:50%;flex-shrink:0}
.hint{color:var(--dim)}

@media (max-width:560px){
  header,.controls{padding-left:12px;padding-right:12px}
  .panel{padding:12px}
  .legend{padding:10px 12px}
  .tg-btn{padding:6px 10px;font-size:12px}
  .key-btn{min-width:36px;padding:5px 8px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <img class="logo" src="icon-192.png" alt="" onerror="this.remove()">
  <div>
    <h1>Escalas — Guitarra</h1>
    <p>Pentatônica e escalas naturais em todas as tonalidades, afinação padrão</p>
  </div>
</header>

<div class="controls">
  <div class="key-row" id="keyRow"></div>
  <div class="row">
    <div class="toggle-group">
      <button class="tg-btn" data-type="penta">Pentatônica</button>
      <button class="tg-btn" data-type="natural">Natural</button>
    </div>
    <div class="toggle-group">
      <button class="tg-btn" data-mode="minor">Menor</button>
      <button class="tg-btn" data-mode="major">Maior</button>
    </div>
    <div class="toggle-group">
      <button class="tg-btn" data-labels="notes">Notas</button>
      <button class="tg-btn" data-labels="intervals">Intervalos</button>
    </div>
  </div>
  <div class="row">
    <div class="rel-badge" id="relBadge"></div>
    <div class="pills" id="pills"></div>
  </div>
</div>

<nav class="tabs">
  <button class="tab-btn" data-tab="boxes" id="tabBoxes">5 Boxes</button>
  <button class="tab-btn" data-tab="fullneck">Braço completo</button>
  <button class="tab-btn" data-tab="licks">Frases para solo</button>
</nav>

<section class="panel" id="panel-boxes">
  <div class="grid" id="boxes"></div>
</section>

<section class="panel" id="panel-fullneck">
  <div class="card">
    <div class="fn-head">
      <span class="fn-title" id="fnTitle"></span>
      <div class="chips" id="fnChips"></div>
    </div>
    <div class="fn-wrap" id="fnWrap"></div>
  </div>
</section>

<section class="panel" id="panel-licks">
  <div class="toolbar">
    <label class="ctrl">Andamento <input type="range" id="bpm" min="50" max="160" step="5"> <strong id="bpmVal"></strong> BPM</label>
    <label class="ctrl"><input type="checkbox" id="loop"> Repetir</label>
    <button class="btn" id="droneBtn">Drone da tônica</button>
  </div>
  <div class="tip" id="tip"></div>
  <div class="grid" id="licks"></div>
</section>

<footer class="legend">
  <div class="li"><div class="ld" style="background:#c92a2a"></div>Tônica menor</div>
  <div class="li"><div class="ld" style="background:#e67700"></div>Tônica maior</div>
  <div class="li"><div class="ld" style="background:#1864ab"></div>Nota da escala</div>
  <div class="li"><div class="ld" style="background:#0e9aa0;outline:2px dashed #0e9aa0;outline-offset:1px"></div>Bend (onde puxar)</div>
  <div class="li"><div class="ld" style="background:#0e9aa0"></div>Nota de passagem</div>
  <div class="li hint">Toque em qualquer nota para ouvir</div>
</footer>

<script>
// ═══════════════════ Teoria ═══════════════════
const NS='http://www.w3.org/2000/svg';
const CHROMATIC=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const OPEN=[4,9,2,7,11,4];            // E A D G B e
const OPEN_MIDI=[40,45,50,55,59,64];
const SL=['E','A','D','G','B','e'];
const SW=[2.2,1.7,1.3,1.0,0.75,0.55];
const KEY_DISPLAY={'C':'C','C#':'C#','D':'D','D#':'Eb','E':'E','F':'F','F#':'F#','G':'G','G#':'Ab','A':'A','A#':'Bb','B':'B'};
const KEYS=CHROMATIC.slice();
const IV=['1','b2','2','b3','3','4','b5','5','b6','6','b7','7'];
const INTERVALS={
  penta:  {minor:[0,3,5,7,10],     major:[0,2,4,7,9]},
  natural:{minor:[0,2,3,5,7,8,10], major:[0,2,4,5,7,9,11]}
};
const COL={rm:['#c92a2a','#7b1111'],rM:['#e67700','#944700'],bn:['#0e9aa0','#066b70'],out:['#0e9aa0','#066b70'],n:['#1864ab','#0b3d7a']};
const INLAY=[3,5,7,9,15,17,19,21], INLAY2=[12,24];

const $=id=>document.getElementById(id);
const idx=n=>CHROMATIC.indexOf(n);
const noteAt=(s,f)=>CHROMATIC[(OPEN[s]+f)%12];
function el(tag,attrs,text){const e=document.createElementNS(NS,tag);if(attrs)for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!=null)e.textContent=text;return e;}

function getScaleList(key,type,mode){const k=idx(key);return INTERVALS[type][mode].map(i=>CHROMATIC[(k+i)%12]);}
function getScale(key,type,mode){return new Set(getScaleList(key,type,mode));}
function getRoots(key,mode){const k=idx(key);return{minor:mode==='minor'?key:CHROMATIC[(k+9)%12],major:mode==='minor'?CHROMATIC[(k+3)%12]:key};}
function getRelative(key,mode){const k=idx(key);return mode==='minor'?CHROMATIC[(k+3)%12]:CHROMATIC[(k+9)%12];}
function getBlueNote(key,mode){const k=idx(key);const rm=mode==='minor'?k:(k+9)%12;return CHROMATIC[(rm+6)%12];}

function getBoxNotes(key,type,mode,fretStart,fretEnd){
  const scale=getScale(key,type,mode), roots=getRoots(key,mode);
  const blue=type==='penta'?getBlueNote(key,mode):null;
  const result=[];
  for(let s=0;s<6;s++){
    const notes=[];
    for(let f=fretStart;f<=fretEnd;f++){
      const n=noteAt(s,f);
      if(scale.has(n)){
        let t='n';
        if(n===roots.minor)t='rm'; else if(n===roots.major)t='rM';
        notes.push({fret:f,note:n,t});
      }
      // Blue note: marca a casa de ORIGEM do bend (casa anterior)
      if(blue&&n===blue&&!scale.has(n)){
        const bf=f-1, bn=noteAt(s,bf);
        if(bf>=Math.max(fretStart,1)&&scale.has(bn)){
          const i=notes.findIndex(x=>x.fret===bf); if(i>=0)notes.splice(i,1);
          notes.push({fret:bf,note:bn,t:'bn',bendTo:n});
        }
      }
    }
    result.push(notes);
  }
  return result;
}

// ═══════════════════ Posições ═══════════════════
// Pentatônica: boxes do PDF GuitarSix (referência Am)
const AM_BASES=[5,7,9,12,13], BOX_SPANS=[5,5,5,5,5];
function pentaShift(key){const tr=(idx(key)-9+12)%12;return (5+tr>=13)?tr-12:tr;}
// Natural: posições do PDF GuitarSix (offsets a partir da tônica na corda E)
const NAT_OFFSETS={minor:[-2,2,3,5,7],major:[-2,0,2,4,7]};
const NAT_SPANS={minor:[6,5,5,5,5],major:[5,5,6,7,6]};
function getNatBase(bi,key,mode){let r=((idx(key)-OPEN[0])%12+12)%12;if(r<3)r+=12;return r+NAT_OFFSETS[mode][bi];}

function getPositions(){
  const out=[];
  for(let bi=0;bi<5;bi++){
    let fStart,span,name;
    if(state.type==='penta'){
      const ak=state.mode==='minor'?state.key:getRelative(state.key,'major');
      fStart=AM_BASES[bi]+pentaShift(ak); span=BOX_SPANS[bi]; name='Box '+(bi+1);
    }else{
      fStart=getNatBase(bi,state.key,state.mode); span=NAT_SPANS[state.mode][bi]; name='Posição '+(bi+1);
    }
    out.push({name,fStart,fEnd:fStart+span});
  }
  return out;
}

// ═══════════════════ Estado ═══════════════════
const state={key:'A',mode:'minor',type:'penta',labels:'notes',tab:'boxes',box:0,bpm:90,loop:false};
try{
  const s=JSON.parse(localStorage.getItem('escalas-state')||'null');
  if(s&&typeof s==='object'){
    if(KEYS.includes(s.key))state.key=s.key;
    if(['minor','major'].includes(s.mode))state.mode=s.mode;
    if(['penta','natural'].includes(s.type))state.type=s.type;
    if(['notes','intervals'].includes(s.labels))state.labels=s.labels;
    if(['boxes','fullneck','licks'].includes(s.tab))state.tab=s.tab;
    if(Number.isInteger(s.box)&&s.box>=0&&s.box<=5)state.box=s.box;
    if(typeof s.bpm==='number'&&s.bpm>=50&&s.bpm<=160)state.bpm=s.bpm;
    state.loop=!!s.loop;
  }
}catch(e){}
function save(){try{localStorage.setItem('escalas-state',JSON.stringify(state));}catch(e){}}

function lbl(note){return state.labels==='intervals'?IV[(idx(note)-idx(state.key)+12)%12]:KEY_DISPLAY[note];}

// ═══════════════════ Desenho ═══════════════════
function drawNote(svg,x,y,r,n,s,fs,opacity){
  const g=el('g',{class:'note','data-pos':s+'-'+n.fret});
  if(opacity!=null&&opacity<1)g.setAttribute('opacity',opacity);
  const [fill,stroke]=COL[n.t]||COL.n;
  const c=el('circle',{cx:x,cy:y,r,fill,stroke,'stroke-width':n.t==='bn'?2:1.5});
  if(n.t==='bn')c.setAttribute('stroke-dasharray','2.5 1.5');
  g.appendChild(c);
  const t=lbl(n.note)+(n.t==='bn'?'↑':'');
  const size=t.length>=3?fs-1.5:fs;
  g.appendChild(el('text',{x,y:y+size*0.36,'text-anchor':'middle','font-size':size,fill:'#ffffff','font-weight':700},t));
  g.appendChild(el('title',null,`${SL[s]} · casa ${n.fret} · ${KEY_DISPLAY[n.note]} (${IV[(idx(n.note)-idx(state.key)+12)%12]})`));
  g.addEventListener('click',()=>playSingle(s,n.fret,n.t==='bn'?'hb':''));
  svg.appendChild(g);
}

// Braço compacto (boxes e frases)
function buildNeck(stringNotes,fStart,fEnd){
  const SPAN=fEnd-fStart, FW=62, LP=28, RP=10, TOP=12, SH=19, BOT=TOP+5*SH, NUM_Y=BOT+19, H=NUM_Y+7;
  const W=LP+RP+SPAN*FW;
  const svg=el('svg',{viewBox:`0 0 ${W} ${H}`,width:W,height:H,class:'neck'});
  svg.appendChild(el('rect',{x:LP,y:TOP,width:SPAN*FW,height:BOT-TOP,rx:3,fill:'#1a1200'}));
  for(let c=0;c<SPAN;c++){
    const f=fStart+c, x=LP+c*FW+FW/2;
    if(INLAY.includes(f))svg.appendChild(el('circle',{cx:x,cy:TOP+2.5*SH,r:4,fill:'#3a2a10'}));
    if(INLAY2.includes(f))[1.5,3.5].forEach(k=>svg.appendChild(el('circle',{cx:x,cy:TOP+k*SH,r:4,fill:'#3a2a10'})));
  }
  const nutCol=fStart===0?1:(fStart===1?0:-1);
  for(let c=0;c<=SPAN;c++){
    const x=LP+c*FW;
    let stroke='#4a3618',w=1;
    if(c===nutCol){stroke='#d8cfb0';w=4;} else if(c===0){stroke='#7a5828';w=2.5;}
    svg.appendChild(el('line',{x1:x,y1:TOP,x2:x,y2:BOT,stroke,'stroke-width':w}));
  }
  for(let c=0;c<SPAN;c++){
    svg.appendChild(el('text',{x:LP+c*FW+FW/2,y:NUM_Y,'text-anchor':'middle','font-size':11,fill:'#ffffff','font-weight':600},fStart+c));
  }
  for(let s=0;s<6;s++){
    const y=TOP+(5-s)*SH;
    svg.appendChild(el('line',{x1:LP,y1:y,x2:W-RP,y2:y,stroke:'#c4a840','stroke-width':SW[s],opacity:0.7}));
    svg.appendChild(el('text',{x:LP-9,y:y+3.5,'text-anchor':'middle','font-size':10,fill:'#e6edf3','font-weight':600},SL[s]));
  }
  stringNotes.forEach((sn,s)=>{
    const y=TOP+(5-s)*SH;
    sn.forEach(n=>{
      if(n.fret<fStart||n.fret>=fEnd)return;
      drawNote(svg,LP+(n.fret-fStart)*FW+FW/2,y,9,n,s,8.5);
    });
  });
  return svg;
}

// Braço completo: corda solta + casas 1–22
function buildFullNeck(stringNotes,hl){
  const MAXF=22, LP=24, OW=28, FW=40, RP=10, TOP=12, SH=19, BOT=TOP+5*SH, NUM_Y=BOT+18, H=NUM_Y+7;
  const W=LP+OW+MAXF*FW+RP;
  const xL=f=>f===0?LP:LP+OW+(f-1)*FW, xR=f=>f===0?LP+OW:LP+OW+f*FW, xC=f=>(xL(f)+xR(f))/2;
  const svg=el('svg',{viewBox:`0 0 ${W} ${H}`,class:'fullneck'});
  svg.appendChild(el('rect',{x:LP+OW,y:TOP,width:MAXF*FW,height:BOT-TOP,rx:3,fill:'#1a1200'}));

  let fs=-1,fe=-1;
  if(hl){
    fs=hl.fStart; fe=hl.fEnd-1;
    if(fe>MAXF&&fs-12>=0){fs-=12;fe-=12;}
    fe=Math.min(fe,MAXF);
    svg.appendChild(el('rect',{x:xL(fs)+1,y:TOP-7,width:xR(fe)-xL(fs)-2,height:BOT-TOP+14,rx:6,fill:'rgba(124,58,237,0.16)',stroke:'#8b5cf6','stroke-width':1.5,'stroke-dasharray':'4 3'}));
  }
  INLAY.forEach(f=>{if(f<=MAXF)svg.appendChild(el('circle',{cx:xC(f),cy:TOP+2.5*SH,r:4.5,fill:'#3a2a10'}));});
  [1.5,3.5].forEach(k=>svg.appendChild(el('circle',{cx:xC(12),cy:TOP+k*SH,r:4.5,fill:'#3a2a10'})));
  for(let f=1;f<=MAXF;f++)svg.appendChild(el('line',{x1:xR(f),y1:TOP,x2:xR(f),y2:BOT,stroke:'#4a3618','stroke-width':1}));
  svg.appendChild(el('rect',{x:LP+OW-2,y:TOP-1,width:4,height:BOT-TOP+2,fill:'#d8cfb0'}));

  for(let f=0;f<=MAXF;f++){
    const marked=INLAY.includes(f)||f===12;
    svg.appendChild(el('text',{x:xC(f),y:NUM_Y,'text-anchor':'middle','font-size':11,fill:marked?'#ffffff':'#5a6070','font-weight':marked?700:400},f));
  }
  for(let s=0;s<6;s++){
    const y=TOP+(5-s)*SH;
    svg.appendChild(el('line',{x1:LP,y1:y,x2:W-RP,y2:y,stroke:'#c4a840','stroke-width':SW[s],opacity:0.7}));
    svg.appendChild(el('text',{x:LP-9,y:y+3.5,'text-anchor':'middle','font-size':10,fill:'#e6edf3','font-weight':600},SL[s]));
  }

    sn.forEach(n=>{
      if(n.fret>MAXF)return;
      const dim=hl&&(n.fret<fs||n.fret>fe);

// Tablatura
function buildTab(notes,li){
  const cols=[];
  notes.forEach((n,i)=>{if(n.j&&cols.length)cols[cols.length-1].push(i);else cols.push([i]);});
  const LP=24, STEP=36, RP=14, TOP=16, SH=13, H=TOP+5*SH+12;
  const W=LP+cols.length*STEP+RP;
  const svg=el('svg',{viewBox:`0 0 ${W} ${H}`,width:W,height:H,class:'tab'});
  for(let s=0;s<6;s++){
    const y=TOP+(5-s)*SH;
    svg.appendChild(el('line',{x1:LP-4,y1:y,x2:W-RP+6,y2:y,stroke:'#3a4150','stroke-width':1}));
    svg.appendChild(el('text',{x:10,y:y+3.5,'text-anchor':'middle','font-size':9,fill:'#7d8590'},SL[s]));
  }
  [LP-4,W-RP+6].forEach(x=>svg.appendChild(el('line',{x1:x,y1:TOP,x2:x,y2:TOP+5*SH,stroke:'#3a4150','stroke-width':1})));
  cols.forEach((col,c)=>{
    const x=LP+c*STEP+STEP/2;
    col.forEach(i=>{
      const n=notes[i], y=TOP+(5-n.s)*SH;
      let suf='';
      if(n.t==='b')suf='b'; else if(n.t==='hb')suf='b½'; else if(n.t==='r')suf='br';
      if(n.v)suf+='~';
      const label=String(n.f), w=(label.length+suf.length)*6.6+4;
      svg.appendChild(el('rect',{x:x-w/2,y:y-6,width:w,height:12,fill:'#161b22'}));
      const t=el('text',{x,y:y+4,'text-anchor':'middle','font-size':11,class:'fnum',id:`tab-${li}-${i}`},label);
      if(suf)t.appendChild(el('tspan',{fill:'#22d3ee','font-size':10},suf));
      svg.appendChild(t);
      if((n.t==='h'||n.t==='p'||n.t==='s')&&i>0){
        const pv=notes[i-1];
        const sym=n.t==='s'?(n.f>pv.f?'/':'\\'):n.t;
        svg.appendChild(el('text',{x:x-STEP/2,y:y-5,'text-anchor':'middle','font-size':9,fill:'#a78bfa','font-style':'italic'},sym));
      }
    });
  });
  return svg;
}

function transposed(lick){
  let off=(idx(state.key)-9+12)%12;
  const minF=Math.min(...lick.notes.map(n=>n.f));
  if(minF+off>12)off-=12;
  return lick.notes.map(n=>Object.assign({},n,{f:n.f+off}));
}
function lickTags(lick){
  const out=[], has=t=>lick.notes.some(x=>x.t===t);
  if(has('b')||has('hb'))out.push(['Bend','cy']);
  if(has('r'))out.push(['Bend e solta','cy']);
  if(has('h'))out.push(['Hammer-on','']);
  if(has('p'))out.push(['Pull-off','']);
  if(has('s'))out.push(['Slide','']);
  if(lick.notes.some(x=>x.v))out.push(['Vibrato','']);
  (lick.tags||[]).forEach(t=>out.push([t,'cy']));
  return out;
}
function lickNeck(notes){
  const scale=getScale(state.key,state.type,state.mode), roots=getRoots(state.key,state.mode);
  const map=new Map();
  notes.forEach(n=>{
    const key=n.s+'-'+n.f, note=noteAt(n.s,n.f);
    const bend=n.t==='b'||n.t==='hb'||n.t==='r';
    let t=bend?'bn':!scale.has(note)?'out':note===roots.minor?'rm':note===roots.major?'rM':'n';
    if(map.has(key)&&map.get(key).t==='bn')return;
    map.set(key,{s:n.s,fret:n.f,note,t});
  });
  const sn=[[],[],[],[],[],[]];
  map.forEach(v=>sn[v.s].push(v));
  const frets=notes.map(n=>n.f), minF=Math.min(...frets), maxF=Math.max(...frets);
  return buildNeck(sn,minF,Math.max(maxF+1,minF+4));
}

// ═══════════════════ Áudio (Karplus-Strong) ═══════════════════
let AC=null, master=null, drone=null, playing=null, timers=[];
const bufCache=new Map(), playNodes=new Set();
const PLAY_HTML='<svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M2 1l7 4-7 4z" fill="currentColor"/></svg>Tocar';
const STOP_HTML='<svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><rect x="2" y="2" width="6" height="6" fill="currentColor"/></svg>Parar';
const midiFreq=m=>440*Math.pow(2,(m-69)/12);

function ac(){
  if(!AC){
    const C=window.AudioContext||window.webkitAudioContext; if(!C)return null;
    AC=new C();
    const comp=AC.createDynamicsCompressor(); comp.threshold.value=-14; comp.ratio.value=4;
    master=AC.createGain(); master.gain.value=0.75;
    master.connect(comp); comp.connect(AC.destination);
  }
  if(AC.state==='suspended')AC.resume();
  return AC;
}
function pluckBuffer(freq,dur){
  const ctx=AC, sr=ctx.sampleRate, key=Math.round(freq*100)+'_'+dur;
  if(bufCache.has(key))return bufCache.get(key);
  const len=Math.max(1,Math.floor(sr*dur)), buf=ctx.createBuffer(1,len,sr), d=buf.getChannelData(0);
  const P=sr/freq-0.5, Nn=Math.floor(P), fr=P-Nn, g=Math.pow(0.001,1/(freq*3.2));
  let prev=0;
  for(let i=0;i<=Nn+1&&i<len;i++){prev=prev*0.5+(Math.random()*2-1)*0.5;d[i]=prev;}
  for(let i=Nn+2;i<len;i++){
    const a=0.5*(d[i-Nn]+d[i-Nn-1]), b=0.5*(d[i-Nn-1]+d[i-Nn-2]);
    d[i]=g*((1-fr)*a+fr*b);
  }
  let peak=0; for(let i=0;i<Math.min(len,Nn*4);i++)peak=Math.max(peak,Math.abs(d[i]));
  if(peak>0){const k=0.8/peak;for(let i=0;i<len;i++)d[i]*=k;}
  if(bufCache.size>200)bufCache.clear();
  bufCache.set(key,buf); return buf;
}
function pluck(s,f,when,dur,tech,opt){
  opt=opt||{}; const ctx=ac(); if(!ctx)return;
  const src=ctx.createBufferSource();
  src.buffer=pluckBuffer(midiFreq(OPEN_MIDI[s]+f),Math.min(4,Math.ceil((dur+1.2)*4)/4));
  const lp=ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=3800;
  const g=ctx.createGain();
  const vol=(tech==='h'||tech==='p')?0.6:(tech==='s'?0.7:0.95);
  src.connect(lp); lp.connect(g); g.connect(master);
  const end=when+dur+(opt.sustain?1.1:0.04);
  g.gain.setValueAtTime(vol,when);
  g.gain.setValueAtTime(vol,Math.max(when,end-0.05));
  g.gain.linearRampToValueAtTime(0.0001,end);
  const pr=src.playbackRate;
  if(tech==='s'&&opt.from!=null&&opt.from!==f){
    pr.setValueAtTime(Math.pow(2,(opt.from-f)/12),when);
    pr.linearRampToValueAtTime(1,when+Math.min(0.12,dur*0.5));
  }else{
    pr.setValueAtTime(1,when);
    if(tech==='b'||tech==='hb'||tech==='r'){
      const ratio=Math.pow(2,(tech==='hb'?1:2)/12), up=Math.min(0.16,dur*0.4);
      pr.setValueAtTime(1,when+0.02);
      pr.linearRampToValueAtTime(ratio,when+0.02+up);
      if(tech==='r'){
        const hold=when+Math.max(up+0.06,dur*0.5);
        pr.setValueAtTime(ratio,hold);
        pr.linearRampToValueAtTime(1,hold+Math.min(0.16,dur*0.3));
      }
    }
  }
  if(opt.vib){
    const lfo=ctx.createOscillator(), lg=ctx.createGain();
    lfo.frequency.value=5.6;
    const vs=when+Math.min(dur*0.35,0.25)+((tech==='b'||tech==='hb')?0.15:0);
    lg.gain.setValueAtTime(0,when); lg.gain.setValueAtTime(0,vs); lg.gain.linearRampToValueAtTime(0.018,vs+0.15);
    lfo.connect(lg); lg.connect(pr);
    lfo.start(when); lfo.stop(end);
    playNodes.add(lfo); lfo.onended=()=>playNodes.delete(lfo);
  }
  src.start(when); src.stop(end+0.02);
  playNodes.add(src); src.onended=()=>{playNodes.delete(src);try{g.disconnect();}catch(e){}};
}
function playSingle(s,f,tech){const ctx=ac();if(!ctx)return;pluck(s,f,ctx.currentTime+0.01,tech?0.9:0.7,tech,{sustain:true});}

function clearPlayUI(){
  document.querySelectorAll('.fnum.on').forEach(e=>e.classList.remove('on'));
  document.querySelectorAll('.note.hit').forEach(e=>e.classList.remove('hit'));
  if(playing!=null){const b=$('play-'+playing);if(b){b.classList.remove('playing');b.innerHTML=PLAY_HTML;}}
  playing=null;
}
function stopAll(){
  timers.forEach(clearTimeout); timers=[];
  playNodes.forEach(n=>{try{n.stop();}catch(e){}}); playNodes.clear();
  clearPlayUI();
}
function playLick(li){
  if(playing===li){stopAll();return;}
  stopAll();
  const lick=LICKS[state.type][state.mode][li]; if(!lick)return;
  const ctx=ac(); if(!ctx)return;
  const notes=transposed(lick), beat=60/state.bpm, t0=ctx.currentTime+0.08, card=$('lick-'+li);
  let cursor=0, prevStart=0;
  notes.forEach((n,i)=>{
    const start=n.j?prevStart:cursor;
    if(!n.j){prevStart=cursor;cursor+=n.d*beat;}
    const dur=n.d*beat;
    const from=(n.t==='s'&&i>0&&notes[i-1].s===n.s)?notes[i-1].f:null;
    const last=!notes.slice(i+1).some(x=>!x.j);
    pluck(n.s,n.f,t0+start,dur,n.t,{vib:!!n.v,from,sustain:last});
    timers.push(setTimeout(()=>{
      if(!card)return;
      if(!n.j){card.querySelectorAll('.fnum.on').forEach(e=>e.classList.remove('on'));card.querySelectorAll('.note.hit').forEach(e=>e.classList.remove('hit'));}
      const t=$(`tab-${li}-${i}`); if(t)t.classList.add('on');
      const dot=card.querySelector(`.note[data-pos="${n.s}-${n.f}"]`); if(dot)dot.classList.add('hit');
    },Math.max(0,(t0+start-ctx.currentTime)*1000)));
  });
  const endMs=(t0+cursor-ctx.currentTime)*1000;
  if(state.loop){
    timers.push(setTimeout(()=>{stopAll();playLick(li);},Math.max(0,endMs-20)));
  }else{
    timers.push(setTimeout(()=>{timers=[];clearPlayUI();},endMs+900));
  }
  playing=li;
  const b=$('play-'+li); if(b){b.classList.add('playing');b.innerHTML=STOP_HTML;}
}

function startDrone(){
  const ctx=ac(); if(!ctx)return;
  const f=midiFreq(40+((idx(state.key)-4+12)%12));
  const g=ctx.createGain(); g.gain.setValueAtTime(0,ctx.currentTime); g.gain.linearRampToValueAtTime(0.07,ctx.currentTime+0.4);
  const lp=ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=700; lp.Q.value=0.7;
  lp.connect(g); g.connect(master);
  const oscs=[[f,'sawtooth',0],[f,'sawtooth',7],[f*1.5,'triangle',0],[f/2,'sine',0]].map(([fr,type,det])=>{
    const o=ctx.createOscillator(); o.type=type; o.frequency.value=fr; o.detune.value=det; o.connect(lp); o.start(); return o;
  });
  drone={g,oscs};
}
function stopDrone(){
  if(!drone||!AC)return;
  const t=AC.currentTime;
  drone.g.gain.cancelScheduledValues(t); drone.g.gain.setValueAtTime(drone.g.gain.value,t); drone.g.gain.linearRampToValueAtTime(0,t+0.3);
  drone.oscs.forEach(o=>o.stop(t+0.35));
  drone=null;
}

  });
  const w=$('fnWrap'); w.innerHTML='';
  w.appendChild(buildFullNeck(getBoxNotes(state.key,state.type,state.mode,0,24),state.box?pos[state.box-1]:null));
}
function renderLicks(){
  $('tip').textContent=TIPS[state.type][state.mode]+` Frases transpostas para ${KEY_DISPLAY[state.key]} ${state.mode==='minor'?'menor':'maior'}.`;
  const area=$('licks'); area.innerHTML='';
  LICKS[state.type][state.mode].forEach((lick,li)=>{
    const notes=transposed(lick);
    const card=document.createElement('div'); card.className='card'; card.id='lick-'+li;
    card.innerHTML=`<div class="card-head"><span class="card-title">${lick.name}</span><button class="btn" id="play-${li}">${PLAY_HTML}</button></div>`
      +`<div class="tags">${lickTags(lick).map(([t,c])=>`<span class="tag ${c}">${t}</span>`).join('')}</div>`
      +`<p class="lick-desc">${lick.desc}</p>`;
    card.querySelector('#play-'+li).onclick=()=>playLick(li);
    const tw=document.createElement('div'); tw.className='tab-wrap'; tw.appendChild(buildTab(notes,li)); card.appendChild(tw);
    const nw=document.createElement('div'); nw.className='neck-wrap'; nw.appendChild(lickNeck(notes)); card.appendChild(nw);
    area.appendChild(card);
  });
}
function render(){stopAll();syncUI();renderInfo();renderBoxes();renderFullNeck();renderLicks();save();}
function setTab(t){state.tab=t;stopAll();syncUI();save();}
function setKey(k){state.key=k;render();if(drone){stopDrone();startDrone();syncUI();}}

// ═══════════════════ Init ═══════════════════
KEYS.forEach(k=>{
  const b=document.createElement('button'); b.className='key-btn'; b.dataset.key=k; b.textContent=KEY_DISPLAY[k];
  b.onclick=()=>setKey(k); $('keyRow').appendChild(b);
});
document.querySelectorAll('[data-type]').forEach(b=>b.onclick=()=>{state.type=b.dataset.type;state.box=0;render();});
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{state.mode=b.dataset.mode;render();});
document.querySelectorAll('[data-labels]').forEach(b=>b.onclick=()=>{state.labels=b.dataset.labels;render();});
document.querySelectorAll('.tab-btn').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));
$('bpm').oninput=e=>{state.bpm=+e.target.value;$('bpmVal').textContent=state.bpm;save();};
$('loop').onchange=e=>{state.loop=e.target.checked;save();};
$('droneBtn').onclick=()=>{if(drone)stopDrone();else startDrone();syncUI();};
render();

if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{navigator.serviceWorker.register('./sw.js').catch(()=>{});});
}
</script>
</body>
</html>
